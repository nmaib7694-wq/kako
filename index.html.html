  (function loop(now){

    if(S.idle)S.goal.th+=dt*.06;
    const k=1-Math.pow(.002,dt),c=S.c,g=S.goal;c.t.lerp(g.t,k);c.th+=(g.th-c.th)*k;c.ph+=(g.ph-c.ph)*k;c.r+=(g.r-c.r)*k;place(c);
    for(const f of S.fk){const u=f.userData,L=u.a.distanceTo(u.b),s=(T*u.sp+u.off)%(2*L),fw=s<L,p=fw?s/L:2-s/L;f.position.lerpVectors(u.a,u.b,p);const d=fw?u.b.clone().sub(u.a):u.a.clone().sub(u.b);f.rotation.y=Math.atan2(d.x,d.z)}
    S.tr.position.x=-70+(T*9)%140;
    for(const p of S.pins){const u=p.userData;p.position.x+=(u.tx-p.position.x)*Math.min(1,dt*1.6);p.position.z+=(u.tz-p.position.z)*Math.min(1,dt*1.6);const dist=Math.hypot(u.tx-p.position.x,u.tz-p.position.z);p.position.y=5.8+Math.sin(T*2.2+u.i)*.35+Math.min(dist,25)*.12}
    if(S.cur){S.ol.material.opacity=.55+.45*Math.sin(T*5);S.z[S.cur].pad.material.opacity=.45+.2*Math.sin(T*5)}
    S.r.render(S.scene,S.cam);mini();
  })(last);
};
})();

</script>
<script>
const TEAMS={A:{n:'تیمی A',m:'سمکۆ · لیدا + MNR',c:'var(--a)'},B:{n:'تیمی B',m:'هەژار · مێلین + MNR',c:'var(--b)'},C:{n:'تیمی C',m:'عەبدوڵا حەمید (WH) + MNR',c:'var(--c)'}};
const TOTAL=2253;
const tasks=[
[1,'A','CONT 1',188],[1,'B','CONT 1',188],[1,'C','CONT 1',187],
[2,'A','CONT 1',68],[2,'A','CONT 2',120],[2,'B','CONT 2',188],[2,'C','CONT 2',188],
[3,'A','CONT 2',153],[3,'A','CONT 3',35],[3,'B','WH-1',188],[3,'C','WH-1',188],
[4,'A','WH-1',174],[4,'A','WH-2',7],[4,'A','WH-3',10],[4,'B','WH-4',123],[4,'B','CONT 3',32],[4,'B','CONT 4',34],[4,'C','CONT 5',122],[4,'C','Yard',60]
].map((t,i)=>({id:i,d:t[0],t:t[1],loc:t[2],n:t[3]}));
const LOCS=[...new Set(tasks.map(x=>x.loc))];
const KEY='ophkl-stocktake-2026-v2',API='/api/counts';
const $=s=>document.querySelector(s),P=new URLSearchParams(window.__Q||''),page=document.body.dataset.page;
const enc=encodeURIComponent,num=v=>v.toLocaleString('en-US');
const fmt=v=>{const r=Math.round(v*10)/10;return (Number.isInteger(r)?r:r.toFixed(1))+'%'};
let st={c:{},s:{}};
try{st=JSON.parse(localStorage.getItem(KEY))||st}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const sel=f=>tasks.filter(f),done=a=>a.reduce((s,x)=>s+(st.c[x.id]||0),0),plan=a=>a.reduce((s,x)=>s+x.n,0),pct=a=>plan(a)?done(a)/plan(a)*100:0;

/* ---------- cloud sync (Netlify Function + Blobs) ---------- */
const setSync=ok=>{const e=$('#sync');e.className='sync'+(ok?' ok':'');e.textContent=ok?'☁ هاوکات کراوە':'⚠ ئۆفلاین – لەسەر ئامێر'};
async function pull(){
  try{
    const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();let ch=false;
    for(const id in j)if(!st.s[id]||j[id].ts>st.s[id]){st.c[id]=j[id].v;st.s[id]=j[id].ts;ch=true}
    for(const id in st.s)if(!j[id]||j[id].ts<st.s[id])push(+id);
    setSync(true);if(ch){persist();refresh()}
  }catch(e){setSync(false)}
}
async function push(id){
  try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,v:st.c[id]||0,ts:st.s[id]})});setSync(r.ok)}catch(e){setSync(false)}
}
const timers={};
function changed(id){st.s[id]=Date.now();persist();update();clearTimeout(timers[id]);timers[id]=setTimeout(()=>push(id),500)}

/* ---------- helpers ---------- */
function bind(k,text,w){
  document.querySelectorAll('[data-t="'+k+'"]').forEach(e=>e.textContent=text);
  if(w!==undefined)document.querySelectorAll('[data-w="'+k+'"]').forEach(e=>e.style.width=Math.min(100,w)+'%');
}
function pageTasks(){
  if(page==='team')return sel(x=>x.t===P.get('t'));
  if(page==='loc')return sel(x=>x.loc===P.get('l'));
  return tasks;
}
function update(){
  const all=pct(tasks);
  bind('all',fmt(all));bind('allc',num(done(tasks)));bind('allr',num(TOTAL-done(tasks)));
  const rg=$('#ring');if(rg)rg.style.strokeDashoffset=326.7*(1-all/100);
  for(const t in TEAMS){
    const a=sel(x=>x.t===t);bind('mt'+t,fmt(pct(a)),pct(a));
    for(let d=1;d<=4;d++)bind('m'+t+d,fmt(pct(sel(x=>x.t===t&&x.d===d))));
  }
  for(let d=1;d<=4;d++)bind('md'+d,fmt(pct(sel(x=>x.d===d))));
  bind('mall',fmt(all));
  LOCS.forEach((l,i)=>{const a=sel(x=>x.loc===l);bind('ml'+i,fmt(pct(a)),pct(a))});
  const ps=pageTasks();bind('p',fmt(pct(ps)),pct(ps));bind('pc',num(done(ps))+' / '+num(plan(ps)));
  tasks.forEach(x=>bind('k'+x.id,'',(st.c[x.id]||0)/x.n*100));
  if(window.onWH)onWH();
}
function refresh(){
  document.querySelectorAll('input[data-id]').forEach(i=>{if(i!==document.activeElement)i.value=st.c[i.dataset.id]||''});
  update();
}
const row=(x,label)=>`<div class="task"><div class="trow"><div class="l"><b>${label}</b><span>${num(x.n)} ئایتم</span></div><input type="number" inputmode="numeric" min="0" max="${x.n}" placeholder="0" data-id="${x.id}" value="${st.c[x.id]||''}"><button data-full="${x.id}" aria-label="تەواو">✓</button></div><div class="bar"><i data-w="k${x.id}" style="--col:${TEAMS[x.t].c}"></i></div></div>`;
const head=(badge,title,sub,col)=>`<section class="card team" style="--col:${col}"><div class="thead"><div class="badge">${badge}</div><div class="n"><b>${title}</b><span>${sub}</span></div><div class="p" data-t="p">0%</div></div><div class="bar"><i data-w="p" style="--col:${col}"></i></div><div class="cnt"><bdi data-t="pc"></bdi> ئایتم</div></section>`;
const locName=l=>l.startsWith('WH')?'ویرهاوس '+l.slice(3):l.startsWith('CONT')?'کۆنتەینەر '+l.slice(5):'حەوشە (Yard)';
const lrow=(href,label,key,col)=>`<a class="lrow" href="${href}" style="--col:${col||'var(--ok)'}"><span>${label}</span><div class="bar"><i data-w="${key}" style="--col:${col||'var(--ok)'}"></i></div><b data-t="${key}">0%</b></a>`;

/* ---------- pages ---------- */
function home(){
  document.title='ژماردنی ساڵانە ٢٠٢٦ – کۆی گشتی';$('#title').textContent='ژماردنی ساڵانە ٢٠٢٦';
  let m='<tr><th>تیم</th>'+[1,2,3,4].map(d=>`<th>ڕۆژی ${d}</th>`).join('')+'<th>کۆ</th></tr>';
  for(const t in TEAMS)m+=`<tr><td style="color:${TEAMS[t].c}">${TEAMS[t].n}</td>`+[1,2,3,4].map(d=>`<td><span data-t="m${t}${d}">0%</span></td>`).join('')+`<td class="t"><span data-t="mt${t}">0%</span></td></tr>`;
  m+='<tr><td>هەموو</td>'+[1,2,3,4].map(d=>`<td><span data-t="md${d}">0%</span></td>`).join('')+'<td class="t"><span data-t="mall">0%</span></td></tr>';
  $('#main').innerHTML=`<section class="card hero"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="11"/><circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#5fe3a1" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset .5s ease"/></svg><div class="big"><span data-t="all">0%</span><small>کۆی گشتی</small></div></div><div class="info"><h2>ئایتمە ژمێردراوەکان</h2><div class="nums"><span data-t="allc">0</span> <span>/ ${num(TOTAL)}</span></div><div class="rem">ماوە: <b class="lt" data-t="allr"></b> ئایتم</div></div></section>
  <h2 class="sec">تیمەکان</h2><section class="card">${Object.keys(TEAMS).map(t=>lrow('team.html?t='+t,TEAMS[t].n,'mt'+t,TEAMS[t].c)).join('')}</section>
  <h2 class="sec">لۆکەیشنەکان</h2><section class="card">${LOCS.map((l,i)=>lrow('location.html?l='+enc(l),`<bdi>${l}</bdi>`,'ml'+i)).join('')}</section>
  <h2 class="sec">کۆی گشتی – ڕێژەی تەواوبوون</h2><section class="card"><table>${m}</table></section>`;
}
function team(){
  const t=P.get('t');if(!TEAMS[t])return $('#main').innerHTML='<p>تیم نەدۆزرایەوە</p>';
  document.title=TEAMS[t].n+' – ژماردن';$('#title').textContent=TEAMS[t].n;
  let h=head(t,TEAMS[t].n,TEAMS[t].m,TEAMS[t].c);
  for(let d=1;d<=4;d++){
    const ts=tasks.filter(x=>x.t===t&&x.d===d);if(!ts.length)continue;
    h+=`<h3 class="dh">ڕۆژی ${d} – ${num(plan(ts))} ئایتم</h3><section class="card team" style="--col:${TEAMS[t].c}">`+ts.map(x=>row(x,`<a href="location.html?l=${enc(x.loc)}"><bdi>${x.loc}</bdi></a>`)).join('')+'</section>';
  }
  $('#main').innerHTML=h;
}
function locPage(){
  const l=P.get('l'),ts=sel(x=>x.loc===l);if(!ts.length)return $('#main').innerHTML='<p>لۆکەیشن نەدۆزرایەوە</p>';
  document.title=l+' – ژماردن';$('#title').innerHTML=`<bdi>${l}</bdi> – ${locName(l)}`;
  let h=head('📍',locName(l),`<bdi>${l}</bdi> · ${num(plan(ts))} ئایتم`,'var(--ok)');
  for(const t in TEAMS){
    const a=ts.filter(x=>x.t===t);if(!a.length)continue;
    h+=`<h3 class="dh">${TEAMS[t].n} – ${TEAMS[t].m}</h3><section class="card team" style="--col:${TEAMS[t].c}">`+a.map(x=>row(x,'ڕۆژی '+x.d)).join('')+'</section>';
  }
  $('#main').innerHTML=h;
}
function nav(){
  const cur=page==='team'?P.get('t'):page==='loc'?P.get('l'):'';
  $('#nav').innerHTML=`<a class="pill ${page==='home'?'on':''}" href="./">کۆی گشتی</a><a class="pill ${page==='map'?'on':''}" href="warehouse.html">🏭 3D</a>`+Object.keys(TEAMS).map(t=>`<a class="pill ${cur===t?'on':''}" href="team.html?t=${t}">${TEAMS[t].n}</a>`).join('');
  $('#locnav').innerHTML=LOCS.map(l=>`<a class="pill sm ${cur===l?'on':''}" href="location.html?l=${enc(l)}">${l}</a>`).join('');
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const i=e.target.closest('input[data-id]');if(!i)return;
  const x=tasks[+i.dataset.id];let v=parseInt(i.value,10);
  if(isNaN(v)||v<0)v=0;if(v>x.n){v=x.n;i.value=v}
  st.c[x.id]=v;changed(x.id);
});
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-full]');if(!f)return;
  const x=tasks[+f.dataset.full];st.c[x.id]=(st.c[x.id]||0)>=x.n?0:x.n;
  const i=document.querySelector('input[data-id="'+x.id+'"]');if(i)i.value=st.c[x.id]||'';changed(x.id);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

({home,team,loc:locPage,map:()=>window.initWH()})[page]();nav();update();setSync(false);pull();setInterval(pull,15000);

</script>
</body>
